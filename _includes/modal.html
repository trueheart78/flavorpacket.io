<!-- The Modal -->
<div
  id="modal"
  class="hidden fixed top-0 left-0 z-80 w-screen h-screen bg-black/70 flex justify-center items-center"
>
  <!-- The close button -->
  <a class="modal-close-button" href="javascript:void(0)" onclick="closeModal()"
    >&times;</a
  >

  <!-- Left Arrow -->
  <a
    id="modal-left-arrow"
    class="modal-left-arrow"
    href="javascript:void(0)"
    onclick="previousRefImage()"
    >&#8592;</a
  >

  <!-- Right Arrow -->
  <a
    id="modal-right-arrow"
    class="modal-right-arrow"
    href="javascript:void(0)"
    onclick="nextRefImage()"
    >&#8594;</a
  >

  <!-- A big image will be displayed here -->
  <img id="modal-image" alt="" class="modal-image" onclick="closeModal()" />
</div>

<script>
  // Modal image setup
  var currIndex = -1
  var modal = document.getElementById('modal')
  var modalImage = document.getElementById('modal-image')
  var modalLeftArrow = document.getElementById('modal-left-arrow')
  var modalRightArrow = document.getElementById('modal-right-arrow')

  // Touchscreen support
  var touchStartX = 0
  modal.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX
  })
  modal.addEventListener('touchend', (e) => {
    const diff = touchStartX - e.changedTouches[0].clientX
    if (Math.abs(diff) > 50) diff > 0 ? nextRefImage() : previousRefImage()
  })

  // Modal fns
  function showRefImage(src) {
    currIndex = refImageIndex(src)
    toggleModalArrows(currIndex)

    modal.classList.remove('hidden')
    modalImage.src = refImages[currIndex]
  }

  function refImageIndex(src) {
    let index = -1
    if (src[0] != '/') {
      let url = new URL(src)
      src = url.pathname
    }
    for (let i = 0; i < refImages.length; i++) {
      if (refImages[i] == src) {
        index = i
        break
      }
    }
    return index
  }

  function showLeftModalArrow(index) {
    return index > 0
  }

  function showRightModalArrow(index) {
    return index < refImages.length - 1
  }

  function toggleModalArrows(index) {
    if (showLeftModalArrow(index)) {
      modalLeftArrow.classList.remove('hidden')
    } else {
      modalLeftArrow.classList.add('hidden')
    }
    if (showRightModalArrow(index)) {
      modalRightArrow.classList.remove('hidden')
    } else {
      modalRightArrow.classList.add('hidden')
    }
  }

  function previousRefImage() {
    //console.log(currIndex - 1)
    showRefImage(refImages[currIndex - 1])
  }
  function nextRefImage() {
    //console.log(currIndex + 1)
    showRefImage(refImages[currIndex + 1])
  }
  function closeModal() {
    modal.classList.add('hidden')
  }
</script>
